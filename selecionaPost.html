<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentários por Post</title>
  <style>
        body {
        font-family: Arial, sans-serif;
        margin: 20px;
        }
        select {
        padding: 8px;
        margin-bottom: 20px;
        }
        .comentario-card {
        border: 1px solid #ddd;
        padding: 15px;
        margin-bottom: 15px;
        }
        .comentario-card h3 {
        margin-top: 0;
        margin-bottom: 10px;
        }
        .comentario-card p {
        margin: 5px 0;
        }
    </style>
    </head>
    <body>

    <h1>Comentários por Post</h1>

    <label for="post">Selecione um post:</label><br><br>
    <select id="post">
        <!-- As opções serão geradas dinamicamente via JS -->
    </select>

    <div id="areaComentarios"></div>

    <script>
        const posts = [
        { id: 1, title: "Introdução ao DOM" },
        { id: 2, title: "Eventos em JavaScript" },
        { id: 3, title: "O que é uma API?" }
        ];

        const comentarios = [
        { postId: 1, id: 1, name: "Ana", email: "ana@email.com", body: "Explicação muito clara!" },
        { postId: 1, id: 2, name: "Bruno", email: "bruno@email.com", body: "Gostei do exemplo do getElementById." },
        { postId: 2, id: 3, name: "Carla", email: "carla@email.com", body: "addEventListener é bem melhor que onclick." },
        { postId: 3, id: 4, name: "Diego", email: "diego@email.com", body: "A analogia do garçom ajudou muito." },
        { postId: 3, id: 5, name: "Elisa", email: "elisa@email.com", body: "Quero testar o JSONPlaceholder!" },
        { postId: 3, id: 6, name: "Fábio", email: "fabio@email.com", body: "E o método POST, como funciona?" }
        ];

        const selectPost = document.getElementById("post");
        const areaComentarios = document.getElementById("areaComentarios");

        // 1. Gera dinamicamente as opções do <select>
        function carregarOptions() {
        let htmlOptions = `<option value="">Selecione um post</option>`; // Primeira opção vazia

        posts.forEach(post => {
            htmlOptions += `<option value="${post.id}">${post.title}</option>`; // value=id, texto=title
        });

        selectPost.innerHTML = htmlOptions;
        }

        // 2. Evento 'change' ao trocar de opção
        selectPost.addEventListener("change", function() {
        const postIdSelecionado = Number(selectPost.value);

        //se a opção padrão "Selecione um post" for escolhida, esvazia a área de comentários
        if (!postIdSelecionado) {
            areaComentarios.innerHTML = "";
            return;
        }

        //filtra os comentários correspondentes ao postId selecionado
        const comentariosFiltrados = comentarios.filter(
            comentario => comentario.postId === postIdSelecionado
        );

        //monta o título dinâmico com a contagem: "Comentários (X)"
        let htmlContent = `<h2>Comentários (${comentariosFiltrados.length})</h2>`;

        //renderiza cada comentário com nome, e-mail e texto
        comentariosFiltrados.forEach(c => {
            htmlContent += `
            <div class="comentario-card">
                <h3><strong>${c.name}</strong></h3>
                <p>E-mail: ${c.email}</p>
                <p>${c.body}</p>
            </div>
            `;
        });

        areaComentarios.innerHTML = htmlContent;
        });

        // Inicializa as opções na montagem da página
        carregarOptions();
    </script>

</body>
</html>
