<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Post</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            padding: 8px;
        }
        #resultado {
            margin-top: 20px;
        }
        .erro {
         color: red;
        }
    </style>
    </head>
    <body>

    <h1>Buscar Post</h1>

    <input type="number" id="inputId" placeholder="Digite um ID">
    <button onclick="buscarPost()">Buscar</button>

    <div id="resultado"></div>

    <script>
        const posts = [
        { userId: 1, id: 1, title: "Primeiro post", body: "Aprendendo a manipular o DOM." },
        { userId: 1, id: 2, title: "Segundo post", body: "Arrays de objetos são parecidos com o JSON de uma API." },
        { userId: 2, id: 3, title: "Terceiro post", body: "Em breve vamos buscar estes dados no servidor." },
        { userId: 2, id: 4, title: "Quarto post", body: "O método find devolve o primeiro item encontrado." },
        { userId: 3, id: 5, title: "Quinto post", body: "Se nada for encontrado, find devolve undefined." }
        ];

        function buscarPost() {
            const input = document.getElementById("inputId");
            const divResultado = document.getElementById("resultado");
            const valorInput = input.value.trim();

            if (valorInput === "") {
                divResultado.innerHTML = `<p class="erro">Digite um ID.</p>`;
                return;
        }

        const idBuscado = Number(valorInput);

        const postEncontrado = posts.find(post => post.id === idBuscado);

        if (postEncontrado) {
            divResultado.innerHTML = `
            <h2>${postEncontrado.title}</h2>
            <p>${postEncontrado.body}</p>
            `;
        } else {
            divResultado.innerHTML = `
            <p class="erro">Post não encontrado (ID ${idBuscado}). Os IDs válidos vão de 1 a 5.</p>
            `;
        }
        }
    </script>
    </body>
</html>
